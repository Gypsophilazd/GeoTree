[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geotree"
version = "0.1.0"
description = "A task-grounded verification and safe-repair harness for autonomous parametric CAD agents, built with FreeCAD and Harbor."
requires-python = ">=3.12"
dependencies = ["harbor==0.23.0"]

[tool.setuptools.packages.find]
where = ["src"]
